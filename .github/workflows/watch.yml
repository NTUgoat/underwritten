name: watch

# The study's continuing operation.
#
# Cohort companies file on a schedule nobody here controls. This job runs weekly,
# notices what is new, classifies any adverse filing event under METHOD.md §7.2
# (honouring Amendment 1's exclusions), and reports any kill criterion whose date
# has passed.
#
# It exists to make two claims true rather than asserted:
#
#   * The public record accrues whether or not the author touches the project.
#   * A position is graded by a machine reading filings, not by its author
#     deciding whether he still believes it - which is what METHOD.md §9 means by
#     "evaluated by a scheduled job ... without the author's involvement".
#
# It commits the new high-water mark and report, so the diff each week is the
# evidence. It never edits METHOD.md, the frozen cohort, or the adjudication
# ledger - those are the study, and a scheduled job has no business touching them.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Require a real SEC contact
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          if [ -z "${SEC_CONTACT}" ]; then
            echo "::error::SEC_CONTACT repository secret is not set."
            echo "The SEC fair-access policy requires a declared User-Agent carrying a"
            echo "real contact address. Set it to e.g. 'Jex Lin jlin048@e.ntu.edu.sg'"
            echo "under Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "${SEC_CONTACT}" in
            *@*) : ;;
            *) echo "::error::SEC_CONTACT has no email address in it."; exit 1 ;;
          esac

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check the cohort for new filings
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python -m pipeline.watch --write

      - name: Summarise into the run log
        run: |
          python - <<'PY'
          import json, os, pathlib
          report = json.loads(pathlib.Path("data/derived/watch_report.json").read_text(encoding="utf-8"))
          lines = [
              "## Cohort watch",
              "",
              f"Checked {report['issuers_checked']} issuers on {report['checked_on']}.",
              "",
          ]
          if report.get("baseline_established"):
              lines.append("First run: baseline established, nothing reported as new.")
          else:
              lines += [
                  f"- New filings: **{len(report['new_filings'])}**",
                  f"- New adverse events: **{len(report['new_adverse_events'])}**",
                  f"- Kill criteria due: **{len(report['kill_criteria_due'])}**",
                  "",
              ]
              for e in report["new_adverse_events"]:
                  lines.append(f"  - {e['filed']} {e['form']} — {e['issuer']}: {e['reason']}")
              for d in report["kill_criteria_due"]:
                  lines.append(f"  - {d['position']} criterion #{d['n']} due {d['by_date']}: {d['test']}")
          if report.get("errors"):
              lines += ["", f"{len(report['errors'])} issuer(s) could not be reached; previous state carried forward."]
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Commit the new state
        run: |
          git config user.name  "underwritten-watch[bot]"
          git config user.email "underwritten-watch@users.noreply.github.com"
          git add data/derived/watch_state.json data/derived/watch_report.json
          if git diff --cached --quiet; then
            echo "Nothing changed this week."
            exit 0
          fi
          NEW=$(python -c "import json;d=json.load(open('data/derived/watch_report.json'));print(len(d['new_filings']))")
          ADV=$(python -c "import json;d=json.load(open('data/derived/watch_report.json'));print(len(d['new_adverse_events']))")
          git commit -m "Cohort watch: ${NEW} new filing(s), ${ADV} adverse event(s)

          Scheduled check of the frozen cohort against EDGAR. Adverse events are
          classified under METHOD.md section 7.2 with Amendment 1's exclusions
          applied. This job does not touch METHOD.md, the frozen cohort, or the
          adjudication ledger."
          git push
